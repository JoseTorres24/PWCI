<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Gestión de Jugadores</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="../ADMIN/adminCSS.css">
</head>
<body>

<header class="admin-hero">
  <div class="hero-contenido">
    <p class="admin-etiqueta">FIFA World Cup 2026</p>
    <h1>Gestión de Jugadores</h1>
    <nav class="admin-nav">
      <a href="../ADMIN/admin-dashboard.html">Panel Principal</a>
      <a href="../ADMIN/admin-jugadores.html" class="activo">Gestionar Jugadores</a>
      <a href="../ADMIN/admin-equipos.html">Gestionar Equipos</a>
      <a href="../COLECCIONISTA/MAIN/index.html" class="salir">Cerrar sesión</a>
    </nav>
  </div>
</header>

<main class="admin-layout">
  <section class="card-panel">
    <div class="encabezado-seccion">
      <h2>Registrar Jugador</h2>
      <div class="acciones-superiores">
        <a href="../ADMIN/admin-dashboard.html" class="boton-secundario">Volver al panel</a>
      </div>
    </div>

    <form>
      <div class="campo">
        <label>Nombre</label>
        <input type="text" required>
      </div>

      <div class="campo">
        <label>Número de Camiseta</label>
        <input type="number" required>
      </div>

      <div class="campo">
        <label>Posición</label>
        <input type="text" required>
      </div>

      <div class="campo">
        <label>Equipo</label>
        <select>
          <option>México</option>
          <option>Argentina</option>
          <option>Francia</option>
        </select>
      </div>

      <div class="campo-completo">
        <label>Fotografía</label>
        <input type="file">
      </div>

      <div class="form-acciones">
        <button type="submit">Guardar Jugador</button>
      </div>
    </form>
  </section>

  <section class="card-panel">
    <h2>Lista de Jugadores</h2>

    <div class="table-wrap">
      <table>
        <tr>
          <th>Nombre</th>
          <th>Equipo</th>
          <th>Número</th>
          <th>Acciones</th>
        </tr>

        <tr>
          <td>Lionel Messi</td>
          <td>Argentina</td>
          <td>10</td>
          <td>
            <button>Editar</button>
            <button>Eliminar</button>
          </td>
        </tr>

        <tr>
          <td>Kylian Mbappé</td>
          <td>Francia</td>
          <td>7</td>
          <td>
            <button>Editar</button>
            <button>Eliminar</button>
          </td>
        </tr>
      </table>
    </div>
  </section>
</main>

</body>
</html>
